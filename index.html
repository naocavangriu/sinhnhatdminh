<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #fce4ec; font-family: 'Quicksand', sans-serif; overflow: hidden; color: #880e4f; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; text-align: center; }
        .cake { font-size: 60px; margin-bottom: 10px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        h1 { font-family: 'Pacifico', cursive; font-size: 30px; color: #d81b60; margin: 10px 0; }
        .message-box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 85%; min-height: 120px; font-size: 18px; line-height: 1.5; position: relative; z-index: 2; }
        .balloon { position: absolute; bottom: -100px; width: 40px; height: 50px; border-radius: 50%; animation: fly 6s infinite ease-in; opacity: 0.6; }
        @keyframes fly { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-120vh) rotate(20deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="cake">🎂</div>
        <h1 id="name-display">Happy Birthday!</h1>
        <div class="message-box" id="typewriter"></div>
        <p style="margin-top: 25px; font-weight: bold; font-size: 14px; opacity: 0.8;">(Quét mã này là bạn nhất luôn đó! ✨)</p>
    </div>

    <script>
        // Lấy tên từ link giống mẫu bạn gửi
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || "Bạn của tôi";
        document.getElementById('name-display').innerText = "Happy Birthday, " + name + "!";

        // Hiệu ứng chữ chạy
        const text = "Chúc bạn tuổi mới thật rực rỡ, luôn vui vẻ và mãi là người bạn tuyệt vời của chúng mình nhé! Hôm nay mọi điều tốt lành nhất là dành cho bạn.";
        let i = 0;
        function type() {
            if (i < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(i);
                i++; setTimeout(type, 80);
            }
        }
        
        // Tạo bong bóng bay
        function createBalloon() {
            const b = document.createElement('div');
            b.className = 'balloon';
            b.style.left = Math.random() * 100 + 'vw';
            b.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 75%)`;
            b.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 6000);
        }
        setInterval(createBalloon, 600);
        window.onload = type;
    </script>
</body>
</html>
